# =============================================================================
# nginx — web host (Next.js). Install to
# /etc/nginx/sites-available/crossword.eapps.site.conf and symlink
# into sites-enabled. Serves crossword.eapps.site; paths assume
# APP_DIR=/home/michael/apps/crossword.
#
# www.crossword.eapps.site (on the app's certificate) 301s here on both HTTP and HTTPS — never
# proxy www, or CORS_ORIGIN / CSRF / canonicals / hreflang see a second web origin.
#
# Every [lang] page is prerendered (ISR) inside the Next server, so nginx proxies HTML to
# Node and serves only the hashed build assets off disk.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name crossword.eapps.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.crossword.eapps.site;

    location / {
        return 301 https://crossword.eapps.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.crossword.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/crossword.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossword.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://crossword.eapps.site$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crossword.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/crossword.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crossword.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Hashed, immutable build assets, served straight off disk. The path runs through
    # web/current, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/crossword/web/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be revalidated — a cached old worker pins old pages
    # for every installed copy of the app. The route handler (src/app/sw.js/route.ts) sets
    # the same header; this makes it independent of anything in front of Node.
    location = /sw.js {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # /_next/image is the image optimizer, not a static path. It is deliberately NOT
    # matched above so it falls through to Node.

    location / {
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them defeats every Suspense boundary and
        # delays first paint until the whole render finishes.
        proxy_buffering off;

        # NEVER add proxy_cache to this block. src/proxy.ts answers unprefixed requests
        # with personalised 307s carrying `Vary: Accept-Language, Cookie` and
        # `Cache-Control: no-store` — caching them pins the first visitor's language onto
        # everybody else. Prerendered pages are already cached inside Next (ISR).

        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
