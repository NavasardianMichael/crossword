# =============================================================================
# nginx — API host (Express). Install to
# /etc/nginx/sites-available/api.crossword.eapps.site.conf and
# symlink into sites-enabled. Serves api.crossword.eapps.site
# over HTTPS only; paths assume APP_DIR=/home/michael/apps/crossword.
#
# HTTPS only: plain HTTP is neither served nor redirected. The :80 server exists for one
# thing — Let's Encrypt's HTTP-01 challenge, which always arrives over port 80, so
# `certbot renew` (webroot, /var/www/html) can renew this name. Anything else on :80 has
# its connection closed (444).
#
# The API is a separate origin on purpose: the browser calls it directly at
# NEXT_PUBLIC_API_URL, so Express answers CORS for CORS_ORIGIN (the web host) and
# requireSameOrigin checks Origin against the same value.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.crossword.eapps.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.crossword.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/api.crossword.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.crossword.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:9007;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT clear or rewrite Origin/Referer. requireSameOrigin
        # (server/src/middleware/csrf.ts) rejects any state-changing request whose Origin
        # does not equal CORS_ORIGIN, and in production rejects one that carries neither.

        proxy_connect_timeout 10s;
        # A cold word bucket is generated by Gemini on the request — the model chain
        # with retries can take tens of seconds. Longer than bookie's 60s on purpose.
        proxy_read_timeout    90s;
        proxy_send_timeout    60s;
    }
}
